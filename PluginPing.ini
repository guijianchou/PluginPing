; PluginPing 1.0.14
; One configuration surface for DIRECT, TCP, PROXY and UDP.

[General]
ConfigVersion=2
RefreshInterval=1000
Timeout=1000
MaxFailCount=3
WindowMs=20000
MinSamples=5
RecentAvgCount=6
IdleAfterMs=60000
IdleRefreshInterval=30000
Width=110
DebugLog=false

[IP]
Width=160
DirectResolveIntervalMs=10000
ProxyResolveIntervalMs=1000
; Applies to DIRECT resolution only; PROXY keeps the fast interval above.
FailureBackoffMs=60000
TimeoutMs=3000
FailThreshold=3
DebugLog=false
DirectDisplayIp=

[Color_Rules]
GreenThreshold=97
YellowThreshold=85
GreenColor=
YellowColor=
RedColor=

[Network]
; Auto | Direct | System | Manual
ProxyMode=Auto
ProxyServer=127.0.0.1:7890
ProxyBypass=<local>
ProxyCacheMs=5000
Socks5Server=
; Set true only when the HTTP and SOCKS endpoints select the same upstream node.
ShareProxyIdentityForUdp=false

[TCP_Settings]
Enable=1
; Google remains the only authoritative TCP target.
TargetUrl=https://www.google.com/generate_204
; Cloudflare is diagnostic only and never restores TCP health.
FallbackUrl=https://cp.cloudflare.com/generate_204
ExpectStatus=204

[UDP_Settings]
Enable=1
EchoServer=sg.falsemeet.site:3478
FallbackStunServer=stun.cloudflare.com:3478
BurstPackets=1
DnsRefreshMs=300000

[Style]
; Typography follows TrafficMonitor's active taskbar/main-window font.
CompactMode=false
ShowResourceGraph=false
